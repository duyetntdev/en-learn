server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript text/html;

    # Máy chủ lưu tiến độ (dịch vụ "api" trong docker-compose.yml)
    location ^~ /api/ {
        client_max_body_size 600k;
        proxy_pass http://api:8090;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # File âm thanh và ảnh: cache lâu
    location ~* \.(mp3|png|jpg|jpeg|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML/JS/CSS: luôn kiểm tra bản mới
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Không phục vụ thư mục công cụ
    location /tools/ { deny all; return 404; }
}
